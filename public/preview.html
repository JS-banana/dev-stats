<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dev Stats Preview</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f6f8fa;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(94vw, 1080px);
        margin: 0 auto;
        padding: 40px 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 18px;
        align-items: start;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      
        <img src="../assets/wakatime-language.svg" alt="wakatime-language" />
        <img src="../assets/wakatime-ai.svg" alt="wakatime-ai" />
        <img src="../assets/wakatime-language-dark.svg" alt="wakatime-language-dark" />
        <img src="../assets/wakatime-ai-dark.svg" alt="wakatime-ai-dark" />
    </main>
  </body>
</html>

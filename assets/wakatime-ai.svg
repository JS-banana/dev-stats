<svg xmlns="http://www.w3.org/2000/svg" width="495" height="228" viewBox="0 0 495 228" role="img" aria-labelledby="title desc">
  <title id="title">Weekly AI Stats</title>
  <desc id="desc">2026-W32 AI totals and coding share</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1b1f24" flood-opacity="0.12" />
    </filter>
  </defs>
  <style>
    .card { fill: #fffefe; stroke: #d8dee4; filter: url(#shadow); }
    .title { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #24292f; }
    .label { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #24292f; }
    .time { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #57606a; font-variant-numeric: tabular-nums; }
    .percent { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #57606a; font-variant-numeric: tabular-nums; }
    .metric-row-label { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #24292f; }
    .metric-row-value { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #24292f; font-variant-numeric: tabular-nums; }
    .badge-icon { fill: none; stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .ring-value { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #24292f; text-anchor: middle; font-variant-numeric: tabular-nums; }
    .ring-label { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #57606a; text-anchor: middle; text-transform: uppercase; letter-spacing: 0.04em; }
    .bar-bg { fill: #eaeef2; }
    .blue { fill: #2f81f7; }
    .green { fill: #2da44e; }
    .orange { fill: #d29922; }
    .purple { fill: #8250df; }
    .pink { fill: #bf3989; }
  </style>
  <rect class="card" x="0.5" y="0.5" width="494" height="227" rx="6" />
  <text class="title" x="25" y="34">Weekly AI Stats</text>
  
  <g transform="translate(0 77)">
    <circle class="blue" cx="39" cy="-5" r="13" />
    <svg class="badge-icon" data-icon="database" x="31" y="-13" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
      <ellipse cx="12" cy="5" rx="8" ry="3" />
      <path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5" />
      <path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6" />
    </svg>
    <text class="metric-row-label" x="70" y="0">Total Tokens</text>
    <text class="metric-row-value" x="252" y="0" text-anchor="end">121.69M</text>
  </g>
  <g transform="translate(0 113)">
    <circle class="green" cx="39" cy="-5" r="13" />
    <svg class="badge-icon" data-icon="dollar-sign" x="31" y="-13" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2v20" />
      <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7H14a3.5 3.5 0 0 1 0 7H6" />
    </svg>
    <text class="metric-row-label" x="70" y="0">AI Cost</text>
    <text class="metric-row-value" x="252" y="0" text-anchor="end">$0.00</text>
  </g>
  <g transform="translate(0 149)">
    <circle class="orange" cx="39" cy="-5" r="13" />
    <svg class="badge-icon" data-icon="message-circle" x="31" y="-13" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
      <path d="M8 12h.01" />
      <path d="M12 12h.01" />
      <path d="M16 12h.01" />
    </svg>
    <text class="metric-row-label" x="70" y="0">AI Prompts</text>
    <text class="metric-row-value" x="252" y="0" text-anchor="end">159</text>
  </g>
  <g transform="translate(0 185)">
    <circle class="purple" cx="39" cy="-5" r="13" />
    <svg class="badge-icon" data-icon="code" x="31" y="-13" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
      <path d="m16 18 6-6-6-6" />
      <path d="m14 4-4 16" />
      <path d="m8 6-6 6 6 6" />
    </svg>
    <text class="metric-row-label" x="70" y="0">Line Changes</text>
    <text class="metric-row-value" x="252" y="0" text-anchor="end">10,429</text>
  </g>
  <g>
    <circle cx="382" cy="122" r="48" fill="none" stroke="#eaeef2" stroke-width="12" />
    <circle cx="382" cy="122" r="48" fill="none" stroke="#2f81f7" stroke-linecap="round" stroke-width="12" stroke-dasharray="291.03 301.59" transform="rotate(-90 382 122)" />
    <text class="ring-value" x="382" y="120">96.5%</text>
    <text class="ring-label" x="382" y="143">AI Share</text>
  </g>
</svg>
